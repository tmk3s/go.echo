# version: '3' # composeファイルのバージョン /Users/tomoki/workspace/go.echo/docker-compose.yml: the attribute `version` is obsolete, it will be ignored, please remove it to avoid potential confusion 
services:
  backend: # サービス名
    build: # ビルドに使うDockerファイルのパス
      context: .
      dockerfile: ./Dockerfile
    command: air
    volumes: # マウントディレクトリ
      - ./app:/usr/src/app
    tty: true # コンテナの永続化
    stdin_open: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    # env_file: # .envファイル
    #   - ./build/.go_env
    ports:
      - "1323:1323"
    environment:
      TZ: Asia/Tokyo
      MYSQL_ID: 'root'
      MYSQL_PASSWORD: 'pass'
      MYSQL_HOST: 'db'
      MYSQL_PORT: '3306'
      MYSQL_DATABASE: 'develop'
      JWT_SECRET: 'change-me-in-production'
      APP_ENV: 'development'
      REDIS_ADDR: 'redis:6379'
  front: # サービス名
    build: # ビルドに使うDockerファイルのパス
      context: .
      dockerfile: ./Dockerfile
    command: npm run dev
    working_dir: /usr/src/app/frontend/
    volumes: # マウントディレクトリ
      - ./app/frontend:/usr/src/app/frontend/
    tty: true # コンテナの永続化
    stdin_open: true
    ports:
      - "3000:3000"
    environment:
      - TZ=Asia/Tokyo
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  db:
    image: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 'pass'
      MYSQL_DATABASE: 'develop'
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ppass"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
volumes:
  mysql-data:
    driver: local